[metadata]
name = myoko-property-crawler
version = attr: myoko_property_crawler.__version__
description = Offline-first property aggregation prototype for Myoko, Joetsu and Shinano
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =

[options.packages.find]
where = src

[options.extras_require]
database =
    psycopg[binary]==3.2.13

[options.entry_points]
console_scripts =
    myoko-crawler = myoko_property_crawler.cli:main
